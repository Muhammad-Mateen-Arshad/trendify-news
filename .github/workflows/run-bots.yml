name: Trendify Bots

on:
  schedule:
    - cron: '0 */4 * * *'      # every 4 hours; all six bots run one after another
  workflow_dispatch:
    inputs:
      bot:
        description: 'Which bot to run'
        required: true
        default: all
        type: choice
        options: [all, news, jobs, dramas, scholarships, health, history]

concurrency:
  group: trendify-bots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install googlenewsdecoder || echo "googlenewsdecoder not installed (optional)"

      - name: Run bots one after another
        env:
          BOT_INPUT: ${{ github.event.inputs.bot }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          case "${BOT_INPUT:-all}" in
            all) BOTS="news jobs dramas scholarships health history" ;;
            news|jobs|dramas|scholarships|health|history) BOTS="$BOT_INPUT" ;;
            *) echo "Unknown bot: $BOT_INPUT"; exit 1 ;;
          esac

          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          for bot in $BOTS; do
            echo "::group::${bot} bot"
            python "scripts/${bot}_bot.py" || echo "::warning::${bot} bot finished with errors"
            git add -A
            git commit -m "Auto-update: ${bot}" || echo "Nothing to commit for ${bot}"
            echo "::endgroup::"
          done

      - name: Push changes
        run: |
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "Push failed (attempt $i), retrying in 5 seconds..."
            sleep 5
          done
          exit 1